# 生产环境：参数由进程环境或受控运行配置提供，不导入开发机文件。
spring:
  config:
    activate:
      on-profile: '!test'
    import: nacos:desk-user.yaml?group=${DESK_NACOS_GROUP:DESK_GROUP}&refreshEnabled=true
---
DESK_RESOURCE_ENV: prod

spring:
  flyway:
    user: ${DESK_USER_MIGRATION_USERNAME}
    password: ${DESK_USER_MIGRATION_PASSWORD}

server:
  address: ${DESK_BIND_ADDRESS:0.0.0.0}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

DESK_SECURE_COOKIE: true

# 公共配置：默认开发环境，所需组件随应用装配；凭据由环境或本机文件提供。
server:
  address: ${DESK_BIND_ADDRESS:127.0.0.1}
  port: 26102

spring:
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      flush-mode: immediate
  application:
    name: desk-user
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${DESK_COMPONENT_HOST:192.168.23.66}:8848
        namespace: ${DESK_NACOS_NAMESPACE}
        group: ${DESK_NACOS_GROUP:DESK_GROUP}
        username: ${DESK_NACOS_USERNAME:nacos}
        password: ${DESK_NACOS_PASSWORD}
        ip: ${DESK_APP_HOST}
      config:
        enabled: true
        server-addr: ${DESK_COMPONENT_HOST:192.168.23.66}:8848
        namespace: ${DESK_NACOS_NAMESPACE}
        group: ${DESK_NACOS_GROUP:DESK_GROUP}
        username: ${DESK_NACOS_USERNAME:nacos}
        password: ${DESK_NACOS_PASSWORD}
    sentinel:
      enabled: true
      eager: true
      transport:
        port: 26702
      datasource:
        flow:
          nacos:
            server-addr: ${DESK_COMPONENT_HOST:192.168.23.66}:8848
            namespace: ${DESK_NACOS_NAMESPACE}
            group-id: ${DESK_NACOS_GROUP:DESK_GROUP}
            data-id: desk-user-${DESK_RESOURCE_ENV}-flow.json
            username: ${DESK_NACOS_USERNAME:nacos}
            password: ${DESK_NACOS_PASSWORD}
            rule-type: flow
            data-type: json
        degrade:
          nacos:
            server-addr: ${DESK_COMPONENT_HOST:192.168.23.66}:8848
            namespace: ${DESK_NACOS_NAMESPACE}
            group-id: ${DESK_NACOS_GROUP:DESK_GROUP}
            data-id: desk-user-${DESK_RESOURCE_ENV}-degrade.json
            username: ${DESK_NACOS_USERNAME:nacos}
            password: ${DESK_NACOS_PASSWORD}
            rule-type: degrade
            data-type: json
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: none
          desk-user:
            readTimeout: 3000
  flyway:
    enabled: ${DESK_MIGRATIONS_ENABLED:true}
    url: ${spring.datasource.url}
    user: ${DESK_USER_MIGRATION_USERNAME:${spring.datasource.username}}
    password: ${DESK_USER_MIGRATION_PASSWORD:${spring.datasource.password}}
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
  profiles:
    default: dev
  web:
    resources:
      add-mappings: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: always
  datasource:
    url: jdbc:mysql://${DESK_COMPONENT_HOST:192.168.23.66}:3306/desk_user_${DESK_RESOURCE_ENV}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&connectTimeout=2000&socketTimeout=5000
    username: ${DESK_USER_DB_USERNAME:desk_user_${DESK_RESOURCE_ENV}}
    password: ${DESK_USER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      connection-timeout: 3000
      validation-timeout: 2000
      initialization-fail-timeout: -1
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: SET SESSION time_zone = '+00:00', innodb_lock_wait_timeout = 2, wait_timeout = 60
  data:
    redis:
      host: ${DESK_COMPONENT_HOST:192.168.23.66}
      port: 6379
      database: 0
      username: ${DESK_USER_REDIS_USERNAME:default}
      password: ${DESK_USER_REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s

management:
  tracing:
    enabled: true
    sampling:
      probability: ${DESK_TRACE_SAMPLING:0.1}
    propagation:
      type: w3c
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  zipkin:
    tracing:
      endpoint: http://${DESK_COMPONENT_HOST:192.168.23.66}:9411/api/v2/spans
  health:
    db:
      enabled: false
    redis:
      enabled: false

springdoc:
  api-docs:
    enabled: false
    version: OPENAPI_3_0
  swagger-ui:
    enabled: false
  paths-to-match: /api/v1/**

desk:
  identity:
    rpc:
      enabled: ${DESK_IDENTITY_RPC_ENABLED:true}
      host: ${DESK_BIND_ADDRESS:127.0.0.1}
      port: ${DESK_USER_RPC_PORT:26202}
      ca-file: ${DESK_RPC_CA_FILE}
      certificate-file: ${DESK_USER_RPC_CERTIFICATE_FILE}
      private-key-file: ${DESK_USER_RPC_PRIVATE_KEY_FILE}
    ticket-token: ${DESK_TICKET_USER_TOKEN}
    knowledge-token: ${DESK_KNOWLEDGE_USER_TOKEN}
    ai-token: ${DESK_AI_USER_TOKEN}
    csrf-secret: ${DESK_USER_CSRF_SECRET}
    secure-cookie: ${DESK_SECURE_COOKIE:false}
  infrastructure:
    enabled: true
    resource-env: ${DESK_RESOURCE_ENV}
  internal:
    user-http-timeout: 3s
    rpc-connect-timeout: 2s
    rpc-max-message-bytes: 4194304
  redis-key-prefix: 'desk:${DESK_RESOURCE_ENV}:user:'

logging:
  structured:
    format:
      file: logstash
  file:
    name: ${DESK_LOG_DIRECTORY:./.local/runtime/logs}/desk-user/application.json
  logback:
    rollingpolicy:
      file-name-pattern: ${DESK_LOG_DIRECTORY:./.local/runtime/logs}/desk-user/application.%d{yyyy-MM-dd}.%i.json
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 512MB

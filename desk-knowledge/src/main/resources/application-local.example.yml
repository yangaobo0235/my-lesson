# 本机开发模板：复制为同目录application-local.yml后填写。
# IDEA/Java工作目录设为仓库根目录，默认dev，填写后直接运行Application，无需额外Profile。
# 此文件及真实副本均不进入classes/JAR；只填写本服务凭据，不放模型或其他服务密钥。

# 本机可被服务器访问的IPv4，用于Nacos注册与XXL回调。
DESK_APP_HOST: ""
# 监听地址须与服务消费者可达地址一致；Gateway默认仅回环。
DESK_BIND_ADDRESS: "${DESK_APP_HOST}"
DESK_COMPONENT_HOST: "192.168.23.66"
DESK_KNOWLEDGE_DB_PASSWORD: ""
DESK_KNOWLEDGE_DB_USERNAME: "root"
DESK_KNOWLEDGE_MIGRATION_PASSWORD: "${DESK_KNOWLEDGE_DB_PASSWORD}"
DESK_KNOWLEDGE_MIGRATION_USERNAME: "${DESK_KNOWLEDGE_DB_USERNAME}"
DESK_KNOWLEDGE_REDIS_PASSWORD: ""
DESK_KNOWLEDGE_REDIS_USERNAME: "default"
DESK_LOG_DIRECTORY: "./.local/runtime/logs"
# 启动时执行本服务尚未应用的版本化迁移；开发使用同一root账号。
DESK_MIGRATIONS_ENABLED: "true"
DESK_MQ_PRODUCER_ACCESS_KEY: ""
DESK_MQ_PRODUCER_SECRET_KEY: ""
# 匹配现有内网gRPC Proxy；开启TLS后同步服务端配置。
DESK_MQ_TLS_ENABLED: "false"
DESK_NACOS_GROUP: "DESK_GROUP"
# 真实namespace ID，不是控制台显示名称；desk-test须预建。
DESK_NACOS_NAMESPACE: "desk-test"
DESK_NACOS_PASSWORD: ""
DESK_NACOS_USERNAME: "nacos"
DESK_OSS_ACCESS_KEY_ID: ""
DESK_OSS_ACCESS_KEY_SECRET: ""
# 实际私有版本桶名，地域与endpoint须匹配。
DESK_OSS_BUCKET: ""
DESK_OSS_ENDPOINT: "https://oss-cn-shanghai.aliyuncs.com"
DESK_OSS_REGION: "cn-shanghai"
DESK_RESOURCE_ENV: "test"
DESK_TRACE_SAMPLING: "0.1"
# 执行器通信令牌，与Admin网页登录密码不同。
DESK_XXL_ACCESS_TOKEN: ""

# 链式导入保证配置中心读取前已取得上面的本机参数。
spring:
  config:
    import: nacos:desk-knowledge.yaml?group=${DESK_NACOS_GROUP:DESK_GROUP}&refreshEnabled=true

# 内部领域RPC：服务端证书同时包含serverAuth/clientAuth，用于本服务监听与实际出站调用。
DESK_KNOWLEDGE_RPC_CA_FILE: ""
DESK_KNOWLEDGE_RPC_CERTIFICATE_FILE: ""
DESK_KNOWLEDGE_RPC_PRIVATE_KEY_FILE: ""
DESK_AI_SERVICE_TOKEN: ""
DESK_KNOWLEDGE_AI_RPC_TOKEN: ""
DESK_KNOWLEDGE_USER_TOKEN: ""
DESK_KNOWLEDGE_TICKET_TOKEN: ""
DESK_AI_RPC_TARGET: "localhost:26205"
DESK_KNOWLEDGE_UPLOAD_DIRECTORY: "./.local/runtime/knowledge/uploads"

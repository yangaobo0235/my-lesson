[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mylesson-agent"
version = "1.0.0"
description = "MyLesson Python Agent runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langfuse>=3.2,<4",
    "langgraph>=0.6,<2",
    "openai>=1.99,<3",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "opentelemetry-instrumentation-httpx>=0.57b0,<1",
    "opentelemetry-sdk>=1.36,<2",
    "pgvector>=0.4,<1",
    "prometheus-client>=0.22,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
    "redis>=6.2,<7",
    "sqlalchemy[asyncio]>=2.0.42,<3",
    "structlog>=25.4,<26",
    "tenacity>=9.1,<10",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
    "testcontainers[postgres,redis]>=4.12,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mylesson_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["langfuse.*", "pgvector.*"]
ignore_missing_imports = true

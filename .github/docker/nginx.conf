worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # 不记录查询参数、Cookie、正文或用户私有资源路径。
    log_format safe '$time_iso8601 status=$status bytes=$body_bytes_sent duration=$request_time';
    access_log /dev/stdout safe;
    sendfile on;
    client_max_body_size 64m;
    client_body_timeout 60s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        location = /health {
            access_log off;
            return 204;
        }
        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/web-tls.crt;
        ssl_certificate_key /run/secrets/web-tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location /api/ {
            set $gateway_url http://gateway:26101;
            proxy_pass $gateway_url;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 360s;
            proxy_send_timeout 60s;
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-cache;
        }
    }
}

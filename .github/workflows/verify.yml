name: Verify

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_structure.py
  java:
    needs: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp clean verify
      - run: python3 .github/scripts/check_java_artifacts.py
  python:
    needs: structure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk-ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - run: uv sync --locked --no-install-project
      - run: uv run --locked --no-sync python ../.github/scripts/generate_contracts.py
      - run: uv sync --locked
      - run: uv run --locked ruff check --config pyproject.toml . ../.github/scripts
      - run: uv run --locked ruff format --check --config pyproject.toml . ../.github/scripts
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - run: uv run --locked python ../.github/scripts/build_ai.py --output "${RUNNER_TEMP}/desk-ai-wheel"
  frontend:
    needs: structure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: desk-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
  database:
    needs: structure
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-only
        ports:
          - 33316:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:8.10.3
        ports:
          - 36378:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DESK_VERIFY_REDIS_PORT: '36378'
      DESK_VERIFY_ISOLATED: 'true'
      DESK_VERIFY_HOST: 127.0.0.1
      DESK_VERIFY_PORT: '33316'
      DESK_VERIFY_USERNAME: root
      DESK_VERIFY_PASSWORD: isolated-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - run: mvn -B -ntp -DskipTests package
      - run: uv sync --locked --no-install-project
        working-directory: desk-ai
      - run: uv run --locked --no-sync python ../.github/scripts/generate_contracts.py
        working-directory: desk-ai
      - run: uv sync --locked
        working-directory: desk-ai
      - run: uv run --locked python ../.github/scripts/verify_database.py --work-dir ../.local/ci/database
        working-directory: desk-ai
      - run: uv run --locked python ../.github/scripts/verify_application.py --work-dir ../.local/ci/application
        working-directory: desk-ai

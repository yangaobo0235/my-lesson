name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_structure.py
  java:
    needs: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp clean verify
      - run: python3 .github/scripts/check_java_artifacts.py
  python:
    needs: structure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk-ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - run: uv sync --locked --no-install-project
      - run: uv run --locked --no-sync python ../.github/scripts/generate_contracts.py
      - run: uv sync --locked
      - run: uv run --locked ruff check --config pyproject.toml . ../.github/scripts
      - run: uv run --locked ruff format --check --config pyproject.toml . ../.github/scripts
      - run: uv run --locked pytest
      - run: uv run --locked python ../.github/scripts/build_ai.py --output "${RUNNER_TEMP}/desk-ai-wheel"
  frontend:
    needs: structure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: desk-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

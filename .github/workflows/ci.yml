name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and build all backend modules
        run: mvn -B verify
      - name: Build representative Java containers
        working-directory: .
        run: |
          docker build -f backend-java/Dockerfile --build-arg MODULE=ml-gateway --build-arg MAIN_CLASS=com.yangaobo.GatewayApplication backend-java
          docker build -f backend-java/Dockerfile --build-arg MODULE=ml-agent-relay --build-arg MAIN_CLASS=com.yangaobo.AgentRelayApplication backend-java

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ml-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/ml-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
      - name: Test web application
        run: npm test
      - name: Build web application
        run: npm run build
      - name: Build web container
        working-directory: .
        run: docker build frontend/ml-web

  agent-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-python/pyproject.toml
      - name: Install agent dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint agent
        run: python -m ruff check .
      - name: Type check agent
        run: python -m mypy src
      - name: Test agent
        run: python -m pytest
      - name: Validate Alembic history
        run: python -m alembic heads
      - name: Check public API contract drift
        working-directory: .
        run: |
          python scripts/export_agent_openapi.py
          git diff --exit-code -- contracts/public-agent.openapi.yaml
      - name: Build agent container
        working-directory: .
        run: docker build agent-python

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate application topology
        run: docker compose -f deploy/docker-compose.apps.yml config

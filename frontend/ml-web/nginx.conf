server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve Compose service names at request time so Nginx can start before
    # the gateway container exists and recover automatically when it appears.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(api|user-server|course-server|sale-server|order-server)/ {
        set $gateway http://ml-gateway:24101;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

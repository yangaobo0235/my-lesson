# 公共配置：默认开发环境，所需组件随应用装配；凭据由环境或本机文件提供。
server:
  address: ${DESK_BIND_ADDRESS:127.0.0.1}
  port: 26101

spring:
  application:
    name: desk-gateway
  profiles:
    default: dev
  jackson:
    default-property-inclusion: always
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${DESK_COMPONENT_HOST:192.168.23.66}:8848
        namespace: ${DESK_NACOS_NAMESPACE}
        group: ${DESK_NACOS_GROUP:DESK_GROUP}
        username: ${DESK_NACOS_USERNAME:nacos}
        password: ${DESK_NACOS_PASSWORD}
        ip: ${DESK_APP_HOST}
      config:
        enabled: true
        server-addr: ${DESK_COMPONENT_HOST:192.168.23.66}:8848
        namespace: ${DESK_NACOS_NAMESPACE}
        group: ${DESK_NACOS_GROUP:DESK_GROUP}
        username: ${DESK_NACOS_USERNAME:nacos}
        password: ${DESK_NACOS_PASSWORD}
    sentinel:
      enabled: true
      eager: true
      transport:
        port: 26701
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 15s
          routes:
            - id: user
              uri: ${desk.downstream.user}
              predicates:
                - Path=/api/v1/users/**,/api/v1/admin/organization/**,/api/v1/admin/account/**,/api/v1/admin/audit-event/**
            - id: ticket
              uri: ${desk.downstream.ticket}
              predicates:
                - Path=/api/v1/tickets/**,/api/v1/admin/service-item/**,/api/v1/admin/service-entitlement/**,/api/v1/admin/product-model/**,/api/v1/admin/device/**,/api/v1/admin/onsite-slot/**,/api/v1/admin/onsite-booking/**
            - id: knowledge
              metadata:
                response-timeout: 60000
              uri: ${desk.downstream.knowledge}
              predicates:
                - Path=/api/v1/knowledge/**,/api/v1/admin/document-series/**,/api/v1/admin/document/**,/api/v1/admin/document-event/**,/api/v1/admin/index-job/**
            - id: ai
              metadata:
                response-timeout: 190000
              uri: ${desk.downstream.ai}
              predicates:
                - Path=/api/v1/ai/**,/api/v1/admin/retrieval/**,/api/v1/admin/feedback/**
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: none
          desk-user:
            readTimeout: 3000

management:
  tracing:
    enabled: true
    sampling:
      probability: ${DESK_TRACE_SAMPLING:0.1}
    propagation:
      type: w3c
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  zipkin:
    tracing:
      endpoint: http://${DESK_COMPONENT_HOST:192.168.23.66}:9411/api/v2/spans
  health:
    db:
      enabled: false
    redis:
      enabled: false

desk:
  infrastructure:
    enabled: true
    resource-env: ${DESK_RESOURCE_ENV}
  downstream:
    user: lb://desk-user
    ticket: lb://desk-ticket
    knowledge: lb://desk-knowledge
    ai: ${DESK_AI_URL:http://127.0.0.1:26105}

logging:
  structured:
    format:
      file: logstash
  file:
    name: ${DESK_LOG_DIRECTORY:./.local/runtime/logs}/desk-gateway/application.json
  logback:
    rollingpolicy:
      file-name-pattern: ${DESK_LOG_DIRECTORY:./.local/runtime/logs}/desk-gateway/application.%d{yyyy-MM-dd}.%i.json
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 512MB

# 生产环境：参数由进程环境或受控运行配置提供，不导入开发机文件。
spring:
  config:
    activate:
      on-profile: '!test'
    import: nacos:desk-gateway.yaml?group=${DESK_NACOS_GROUP:DESK_GROUP}&refreshEnabled=true
---
DESK_RESOURCE_ENV: prod

server:
  address: ${DESK_BIND_ADDRESS:0.0.0.0}

desk:
  downstream:
    ai: ${DESK_AI_URL}
